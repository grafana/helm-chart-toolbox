---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: with-baseline

subject:
  path: ../../..
  values:
    query: '{instance="localhost:12345", __name__=~"alloy.*"}'
    env:
      PROMETHEUS_URL: http://prometheus-server.prometheus.svc:9090/api/v1/query
    previousDataConfigMap:
      name: metrics-snapshot-baseline

cluster:
  type: kind

dependencies:
  - preset: prometheus
  - file: alloy.yaml
  # Store the baseline snapshot in a ConfigMap that the chart references via
  # `previousDataConfigMap`, rather than passing it inline.
  - configmap:
      name: metrics-snapshot-baseline
      namespace: default
      contentFromFile:
        baseline.yaml: baseline.yaml

tests:
  - type: kubernetes-objects-test
    values:
      checks:
        - kind: ConfigMap
          name: with-baseline-metrics-snapshot
          namespace: default
        - kind: ConfigMap
          name: metrics-snapshot-baseline
          namespace: default
        - kind: Secret
          name: with-baseline-metrics-snapshot
          namespace: default
  - type: query-test
    values:
      tests:
        - env:
            PROMETHEUS_URL: http://prometheus-server.prometheus.svc:9090/api/v1/query
          queries:
            - query: alloy_build_info{}
  - type: helm-test
