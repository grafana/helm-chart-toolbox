{{- /* The generate pod always runs first (weight 0). It prints a fresh snapshot
       that can be saved as the baseline file. */ -}}
apiVersion: v1
kind: Pod
metadata:
  name: {{ include "helm-chart-toolbox.metrics-snapshot.fullname" . }}-generate
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "helm-chart-toolbox.metrics-snapshot.labels" . | nindent 4 }}
    {{- range $key, $val := .Values.pod.extraLabels }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-delete-policy": before-hook-creation
    "helm.sh/hook-weight": "0"
    {{- range $key, $val := .Values.pod.extraAnnotations }}
    {{ $key }}: {{ $val | quote }}
    {{- end }}
spec:
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
  {{- if .Values.pod.serviceAccount.name }}
  serviceAccountName: {{ .Values.pod.serviceAccount.name }}
  {{- end }}
  {{- if or .Values.global.image.pullSecrets .Values.image.pullSecrets }}
  imagePullSecrets:
    {{- include "helm-chart-toolbox.metrics-snapshot.imagePullSecrets" . | nindent 8 }}
  {{- end }}
  restartPolicy: Never
  {{- with .Values.pod.nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- with .Values.pod.tolerations }}
  tolerations:
    {{- toYaml . | nindent 8 }}
  {{- end }}
  {{- if .Values.initialDelay }}
  initContainers:
    - name: wait
      image: {{ include "helm-chart-toolbox.metrics-snapshot.image" . | quote }}
      command: ["bash", "-c", "sleep {{ .Values.initialDelay | int }}"]
  {{- end }}
  containers:
    - name: generate
      image: {{ include "helm-chart-toolbox.metrics-snapshot.image" . | quote }}
      command:
        - bash
        - -c
        - |
          for i in $(seq 1 {{ .Values.attempts | int }}); do
            echo "Running generate... ($i/{{ .Values.attempts | int }})"
            /usr/bin/generate.sh /etc/config/config.json
            code=$?
            if [ ${code} -eq 0 ]; then exit 0; fi
            if [ ${code} -ne 3 ]; then exit ${code}; fi
            sleep {{ .Values.delay | int }}
          done
          exit 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop: ["ALL"]
        readOnlyRootFilesystem: true
        seccompProfile:
          type: RuntimeDefault
      {{- $envFrom := include "helm-chart-toolbox.metrics-snapshot.envFrom" . | trim }}
      {{- if $envFrom }}
      envFrom:
        {{- $envFrom | nindent 8 }}
      {{- end }}
      volumeMounts:
        - name: config
          mountPath: /etc/config
  volumes:
    - name: config
      configMap:
        name: {{ include "helm-chart-toolbox.metrics-snapshot.fullname" . }}
