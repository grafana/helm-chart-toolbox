---
apiVersion: v1
kind: Namespace
metadata:
  name: alloy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: alloy
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-app
  namespace: alloy
spec:
  interval: 1m
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: alloy
      interval: 1m
  values:
    controller:
      type: deployment
      replicas: 1
    alloy:
      configMap:
        content: |-
          // Scrape Alloy's own pprof endpoints for profiles.
          pyroscope.scrape "self" {
            targets = [
              {"__address__" = "localhost:12345", "service_name" = "alloy"},
            ]
            forward_to = [pyroscope.write.pyroscope.receiver]
          }

          // Write the profiles into Pyroscope.
          pyroscope.write "pyroscope" {
            endpoint {
              url = "http://pyroscope.pyroscope.svc:4040"
            }
          }
