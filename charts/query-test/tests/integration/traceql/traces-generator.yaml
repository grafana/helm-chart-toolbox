---
apiVersion: v1
kind: Namespace
metadata:
  name: alloy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: alloy
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-app
  namespace: alloy
spec:
  interval: 1m
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: alloy
      interval: 1m
  values:
    controller:
      type: deployment
      replicas: 1
    alloy:
      # Expose the OTLP gRPC receiver port on the Alloy service.
      extraPorts:
        - name: otlp-grpc
          port: 4317
          targetPort: 4317
          protocol: TCP
      configMap:
        content: |-
          // Receive OTLP traces from the trace generator.
          otelcol.receiver.otlp "default" {
            grpc {
              endpoint = "0.0.0.0:4317"
            }
            output {
              traces = [otelcol.processor.batch.default.input]
            }
          }

          otelcol.processor.batch "default" {
            output {
              traces = [otelcol.exporter.otlp.tempo.input]
            }
          }

          // Write the traces into Tempo.
          otelcol.exporter.otlp "tempo" {
            client {
              endpoint = "tempo.tempo.svc:4317"
              tls {
                insecure = true
              }
            }
          }
---
# A small generator that continuously sends OTLP traces to Alloy, which forwards
# them on to Tempo. This gives the query-test something to find.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: trace-generator
  namespace: alloy
  labels:
    app.kubernetes.io/name: trace-generator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: trace-generator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: trace-generator
    spec:
      containers:
        - name: telemetrygen
          image: ghcr.io/open-telemetry/opentelemetry-collector-contrib/telemetrygen:latest
          args:
            - traces
            - --otlp-endpoint=alloy-app.alloy.svc:4317
            - --otlp-insecure
            - --rate=5
            - --duration=60m
            - --service=traceql-test
