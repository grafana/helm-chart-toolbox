{{- /* Only create the baseline ConfigMap from inline data. When an existing ConfigMap is
       referenced via `previousDataConfigMap.name`, it is mounted directly instead. */ -}}
{{- if and .Values.previousData (not .Values.previousDataConfigMap.name) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "helm-chart-toolbox.metrics-snapshot.fullname" . }}-baseline
  namespace: {{ .Release.Namespace }}
data:
  baseline.yaml: |-
{{ .Values.previousData | indent 4 }}
{{- end }}
