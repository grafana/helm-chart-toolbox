# yamllint disable rule:document-start rule:line-length rule:trailing-spaces
suite: Metrics Snapshot
templates:
  - configmap.yaml
  - configmap-baseline.yaml
  - secret.yaml
  - tests/test-pods.yaml
tests:
  - it: creates the config, a secret, and only a generate pod when no baseline is provided
    set:
      query: up
      reportThreshold: 1
      failThreshold: 20
      env:
        PROMETHEUS_URL: http://prometheus:9090/api/v1/query
        PROMETHEUS_USER: user
        PROMETHEUS_PASS: pass
    asserts:
      - template: configmap.yaml
        isKind:
          of: ConfigMap
      - template: configmap.yaml
        matchRegex:
          path: data["config.json"]
          pattern: '"query": "up"'
      - template: secret.yaml
        isKind:
          of: Secret
      - template: secret.yaml
        equal:
          path: stringData["PROMETHEUS_URL"]
          value: http://prometheus:9090/api/v1/query
      - template: tests/test-pods.yaml
        hasDocuments:
          count: 1
      - template: tests/test-pods.yaml
        equal:
          path: metadata.name
          value: RELEASE-NAME-metrics-snapshot-generate
      - template: tests/test-pods.yaml
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "0"
      - template: configmap-baseline.yaml
        hasDocuments:
          count: 0

  - it: adds a baseline configmap and a compare pod when previousData is provided
    set:
      query: up
      env:
        PROMETHEUS_URL: http://prometheus:9090/api/v1/query
      previousData: |
        metrics:
          up: 3
    asserts:
      - template: configmap-baseline.yaml
        isKind:
          of: ConfigMap
      - template: configmap-baseline.yaml
        matchRegex:
          path: data["baseline.yaml"]
          pattern: 'up: 3'
      - template: tests/test-pods.yaml
        hasDocuments:
          count: 2
      - template: tests/test-pods.yaml
        documentIndex: 0
        equal:
          path: metadata.name
          value: RELEASE-NAME-metrics-snapshot-generate
      - template: tests/test-pods.yaml
        documentIndex: 1
        equal:
          path: metadata.name
          value: RELEASE-NAME-metrics-snapshot-compare
      - template: tests/test-pods.yaml
        documentIndex: 1
        equal:
          path: metadata.annotations["helm.sh/hook-weight"]
          value: "1"

  - it: does not create a secret when no env is provided
    set:
      query: up
    asserts:
      - template: secret.yaml
        hasDocuments:
          count: 0
