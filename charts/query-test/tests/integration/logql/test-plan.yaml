---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: logql
subject:
  path: ../../..
  values:
    tests:
      - env:
          LOKI_URL: http://loki-gateway.loki.svc:8080/loki/api/v1/query
          LOKI_USER: loki
          LOKI_PASS: lokipassword
        queries:
          - query: count_over_time({source="kubernetes_events"}[1h])
            type: logql

cluster:
  type: kind

dependencies:
  - preset: loki
    overrides:
      loki:
        auth_enabled: false
  - file: logs-generator.yaml

tests:
  - type: helm-test
