---
apiVersion: v1
kind: Namespace
metadata:
  name: alloy
---
# Allow Alloy to read Kubernetes events so it can collect them as logs.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy-events-reader
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: alloy-events-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: alloy-events-reader
subjects:
  - kind: ServiceAccount
    name: alloy-app
    namespace: alloy
---
apiVersion: source.toolkit.fluxcd.io/v1
kind: HelmRepository
metadata:
  name: grafana
  namespace: alloy
spec:
  interval: 1m
  url: https://grafana.github.io/helm-charts
---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: alloy-app
  namespace: alloy
spec:
  interval: 1m
  chart:
    spec:
      chart: alloy
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: alloy
      interval: 1m
  values:
    controller:
      type: deployment
      replicas: 1
    alloy:
      configMap:
        content: |-
          // Collect Kubernetes events from the cluster as a log stream.
          loki.source.kubernetes_events "events" {
            forward_to = [loki.process.labels.receiver]
          }

          // Attach a stable label so the logs are easy to select with LogQL.
          loki.process "labels" {
            stage.static_labels {
              values = {
                source = "kubernetes_events",
              }
            }
            forward_to = [loki.write.loki.receiver]
          }

          // Push the logs to Loki through the gateway (basic auth).
          loki.write "loki" {
            endpoint {
              url = "http://loki-gateway.loki.svc:8080/loki/api/v1/push"
              basic_auth {
                username = "loki"
                password = "lokipassword"
              }
            }
          }
