---
apiVersion: helm-chart-toolbox.grafana.com/v1
kind: TestPlan
name: basic
subject:
  path: ../../..
  values:
    query: {instance="localhost:12345"}
    env:
      PROMETHEUS_URL: http://prometheus-server.prometheus.svc:9090/api/v1/query

cluster:
  type: kind

dependencies:
  - preset: prometheus
  - file: alloy.yaml

tests:
  - type: kubernetes-objects-test
    values:
      checks:
        - kind: ConfigMap
          name: basic-metrics-snapshot
          namespace: default
        - kind: Secret
          name: basic-metrics-snapshot
          namespace: default
  - type: query-test
    values:
      tests:
        - env:
            PROMETHEUS_URL: http://prometheus-server.prometheus.svc:9090/api/v1/query
          queries:
            - query: alloy_build_info{}
  - type: helm-test
